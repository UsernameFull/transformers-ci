name: Repository Keepalive

on:
  workflow_dispatch:

  schedule:
    - cron: "37 3 * * *"
      timezone: "Asia/Tokyo"

concurrency:
  group: repository-keepalive
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  keepalive:
    name: Keep repository active
    runs-on: ubuntu-latest
    steps:
      - name: Checkout default branch (full history)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Decide whether a keepalive commit is due
        id: decide
        run: |
          KEEPALIVE_FILE=".github/keepalive"
          INTERVAL_SECONDS=1296000

          LAST="$(
            git log \
              -1 \
              --format='%ct' \
              -- "${KEEPALIVE_FILE}" \
              2>/dev/null || true
          )"

          NOW="$(date -u +%s)"

          if [[ -z "${LAST}" ]]; then
            echo "keepalive=true" >> "${GITHUB_OUTPUT}"
          elif (( NOW - LAST >= INTERVAL_SECONDS )); then
            echo "keepalive=true" >> "${GITHUB_OUTPUT}"
          else
            echo "keepalive=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Create keepalive commit
        if: steps.decide.outputs.keepalive == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          mkdir -p .github
          {
            echo "# Repository keepalive"
            echo ""
            echo "Last update: $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
            echo "Workflow run: ${RUN_URL}"
          } > .github/keepalive

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .github/keepalive
          git commit -m "chore: keep repository active"

          AUTH_SCRIPT="${RUNNER_TEMP}/git-askpass.sh"
          cat > "${AUTH_SCRIPT}" <<'EOF'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' "x-access-token" ;;
            *) printf '%s\n' "${GH_TOKEN}" ;;
          esac
          EOF
          chmod +x "${AUTH_SCRIPT}"
          export GIT_ASKPASS="${AUTH_SCRIPT}"

          git fetch origin "${DEFAULT_BRANCH}"
          git rebase "origin/${DEFAULT_BRANCH}"
          git push origin "HEAD:${DEFAULT_BRANCH}"
          rm -f "${AUTH_SCRIPT}"
