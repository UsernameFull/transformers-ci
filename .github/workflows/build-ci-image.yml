name: Build CI Image

on:
  workflow_dispatch:

  schedule:
    - cron: "7 3 * * 1"
      timezone: "Asia/Tokyo"

concurrency:
  group: build-ci-image
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and push CANN CI image
    runs-on: linux-aarch64-a2-2
    container:
      image: kaniko-project/executor:latest
      options: --user root
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build and push
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /kaniko/.docker
          AUTH=$(printf '%s:%s' 'github' "${GHCR_TOKEN}" | base64 -w 0)
          printf '{"auths":{"ghcr.io":{"auth":"%s"}}}' "${AUTH}" > /kaniko/.docker/config.json
          /kaniko/executor \
            --context dir:///github/workspace \
            --dockerfile ci.Dockerfile \
            --destination ghcr.io/${GITHUB_REPOSITORY}/transformers-ci-cann:latest \
            --cache=false \
            --no-push-cache
