name: Build CI Image

on:
  workflow_dispatch:

  schedule:
    - cron: "7 3 * * 1"
      timezone: "Asia/Tokyo"

concurrency:
  group: build-ci-image
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and push CANN CI image
    runs-on: linux-aarch64-a2-2
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ci.Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/transformers-ci-cann:latest
