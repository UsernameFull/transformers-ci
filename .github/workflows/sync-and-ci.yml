name: Transformers Sync and CI

on:
  workflow_dispatch:
    inputs:
      python_version_override:
        description: "Override the Python version (default: Python 3.12)"
        required: false
        type: string

  schedule:
    - cron: "0 3 * * *"
      timezone: "Asia/Shanghai"

concurrency:
  group: transformers-sync-ci
  cancel-in-progress: true

permissions:
  contents: read

env:
  UPSTREAM_URL: ${{ vars.UPSTREAM_URL || 'https://github.com/huggingface/transformers.git' }}
  UPSTREAM_BRANCH: ${{ vars.UPSTREAM_BRANCH || 'main' }}
  MIRROR_BRANCH: ${{ vars.MIRROR_BRANCH || 'transformers-main' }}

jobs:
  sync:
    name: Sync upstream to mirror branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
      upstream_sha: ${{ steps.compare.outputs.upstream_sha }}
    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch upstream branch (full history)
        run: |
          git remote add upstream "${UPSTREAM_URL}"
          git fetch \
            --prune \
            --no-tags \
            upstream \
            "+refs/heads/${UPSTREAM_BRANCH}:refs/remotes/upstream/${UPSTREAM_BRANCH}"

      - name: Compare mirror and upstream SHAs
        id: compare
        run: |
          OLD_SHA="$(
            git rev-parse \
              --verify \
              "refs/remotes/origin/${MIRROR_BRANCH}" \
              2>/dev/null || true
          )"
          NEW_SHA="$(git rev-parse "refs/remotes/upstream/${UPSTREAM_BRANCH}")"

          if [[ -z "${OLD_SHA}" || "${OLD_SHA}" != "${NEW_SHA}" ]]; then
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          else
            echo "changed=false" >> "${GITHUB_OUTPUT}"
          fi
          echo "upstream_sha=${NEW_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Push mirror branch
        if: steps.compare.outputs.changed == 'true'
        env:
          SSH_KEY: ${{ secrets.TRANSFORMERS_SYNC_SSH_KEY }}
        run: |
          if [[ -z "${SSH_KEY}" ]]; then
            echo "Secret TRANSFORMERS_SYNC_SSH_KEY is not configured." >&2
            exit 1
          fi
          SSH_KEY_FILE="${RUNNER_TEMP}/deploy_key"
          printf '%s\n' "${SSH_KEY}" > "${SSH_KEY_FILE}"
          chmod 600 "${SSH_KEY_FILE}"
          export GIT_SSH_COMMAND="ssh -i ${SSH_KEY_FILE} -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git push --force "git@github.com:${GITHUB_REPOSITORY}.git" \
            "refs/remotes/upstream/${UPSTREAM_BRANCH}:refs/heads/${MIRROR_BRANCH}"
          rm -f "${SSH_KEY_FILE}"

  ci:
    name: CI (${{ matrix.name }})
    needs: sync
    runs-on: linux-aarch64-a2-2
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: common
            test_path: tests/utils tests/generation tests/pipelines tests/tokenization tests/cli tests/repo_utils
            timeout: 240
          - name: trainer
            test_path: tests/trainer tests/optimization
            timeout: 240
          - name: models
            test_path: tests/models/qwen3
            timeout: 240
          - name: extra
            test_path: tests/exporters tests/integrations tests/kernels tests/heterogeneity tests/tensor_parallel tests/peft_integration tests/sagemaker
            extra_pip: onnx onnxruntime kernels optuna codecarbon peft sagemaker
            timeout: 240
    container:
      image: ascendai/cann:9.0.0-910b-ubuntu22.04-py3.11
      env:
        UV_NO_SYNC: 1
    permissions:
      contents: read
    env:
      HF_ENDPOINT: ${{ vars.HF_ENDPOINT || 'https://hf-mirror.com' }}
      HF_HOME: /root/.cache/huggingface
      PYTHON_VERSION: ${{ inputs.python_version_override || '3.12' }}
    steps:
      - name: Checkout upstream commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.sync.outputs.upstream_sha }}
          path: transformers
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ffmpeg

      - name: Install dependencies
        working-directory: transformers
        env:
          EXTRA_PIP: ${{ matrix.extra_pip }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[torch,testing,vision]"
          python -m pip install librosa torchcodec ${EXTRA_PIP}

      - name: Run tests
        working-directory: transformers
        run: |
          python -m pytest \
            -p random_order \
            -n 2 \
            --dist=loadfile \
            --random-order-bucket=module \
            -rA \
            --junitxml=reports/junit_${{ matrix.name }}.xml \
            ${CI_TEST_PATH}
        env:
          CI_TEST_PATH: ${{ matrix.test_path }}

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.name }}
          path: transformers/reports/
          if-no-files-found: warn

  report:
    name: Test Report
    needs: ci
    if: always() && (needs.ci.result == 'success' || needs.ci.result == 'failure')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download test reports
        uses: actions/download-artifact@v4
        with:
          pattern: test-reports-*
          path: reports
          merge-multiple: true

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: success() || failure()
        with:
          name: Transformers Test Results
          path: reports/**/*.xml
          reporter: java-junit
          fail-on-error: false
          list-tests: "failed"
          use-actions-summary: false
