name: Transformers Sync and CI

on:
  workflow_dispatch:
    inputs:
      python_version_override:
        description: "Override the Python version (default: Python 3.12)"
        required: false
        type: string

  schedule:
    - cron: "0 3 * * *"
      timezone: "Asia/Shanghai"

concurrency:
  group: transformers-sync-ci
  cancel-in-progress: true

permissions:
  contents: read

env:
  UPSTREAM_URL: ${{ vars.UPSTREAM_URL || 'https://github.com/huggingface/transformers.git' }}
  UPSTREAM_BRANCH: ${{ vars.UPSTREAM_BRANCH || 'main' }}
  MIRROR_BRANCH: ${{ vars.MIRROR_BRANCH || 'transformers-main' }}

jobs:
  sync:
    name: Sync upstream to mirror branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
      upstream_sha: ${{ steps.compare.outputs.upstream_sha }}
      run_slow: ${{ steps.runslow.outputs.run_slow }}
    steps:
      - name: Detect Sunday (long test day)
        id: runslow
        run: |
          if [ "$(TZ=Asia/Shanghai date +%u)" = "7" ]; then
            echo "run_slow=1" >> "${GITHUB_OUTPUT}"
          else
            echo "run_slow=0" >> "${GITHUB_OUTPUT}"
          fi

      - name: Checkout repository (full history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch upstream branch (full history)
        run: |
          git remote add upstream "${UPSTREAM_URL}"
          git fetch \
            --prune \
            --no-tags \
            upstream \
            "+refs/heads/${UPSTREAM_BRANCH}:refs/remotes/upstream/${UPSTREAM_BRANCH}"

      - name: Compare mirror and upstream SHAs
        id: compare
        run: |
          OLD_SHA="$(
            git rev-parse \
              --verify \
              "refs/remotes/origin/${MIRROR_BRANCH}" \
              2>/dev/null || true
          )"
          NEW_SHA="$(git rev-parse "refs/remotes/upstream/${UPSTREAM_BRANCH}")"

          if [[ -z "${OLD_SHA}" || "${OLD_SHA}" != "${NEW_SHA}" ]]; then
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          else
            echo "changed=false" >> "${GITHUB_OUTPUT}"
          fi
          echo "upstream_sha=${NEW_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Push mirror branch
        if: steps.compare.outputs.changed == 'true'
        env:
          SSH_KEY: ${{ secrets.TRANSFORMERS_SYNC_SSH_KEY }}
        run: |
          if [[ -z "${SSH_KEY}" ]]; then
            echo "Secret TRANSFORMERS_SYNC_SSH_KEY is not configured." >&2
            exit 1
          fi
          SSH_KEY_FILE="${RUNNER_TEMP}/deploy_key"
          printf '%s\n' "${SSH_KEY}" > "${SSH_KEY_FILE}"
          chmod 600 "${SSH_KEY_FILE}"
          export GIT_SSH_COMMAND="ssh -i ${SSH_KEY_FILE} -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git push --force "git@github.com:${GITHUB_REPOSITORY}.git" \
            "refs/remotes/upstream/${UPSTREAM_BRANCH}:refs/heads/${MIRROR_BRANCH}"
          rm -f "${SSH_KEY_FILE}"

  ci:
    name: CI (${{ matrix.name }})
    needs: sync
    runs-on: linux-aarch64-a2-2
    timeout-minutes: ${{ needs.sync.outputs.run_slow == '1' && 600 || matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: common
            test_path: tests/utils tests/generation tests/pipelines tests/tokenization tests/cli tests/repo_utils tests/test_image_transforms.py tests/test_monkey_patching.py tests/test_tokenization_common.py tests/test_tokenization_mistral_common.py tests/test_tokenizers_backend_mixin.py
            timeout: 240
          - name: trainer
            test_path: tests/trainer tests/optimization
            timeout: 240
          - name: models
            test_path: tests/models/qwen3 tests/models/qwen3_5 tests/models/qwen3_5_moe
            timeout: 240
          - name: extra
            test_path: tests/exporters tests/integrations tests/heterogeneity tests/tensor_parallel tests/pipeline_parallel tests/peft_integration
            extra_pip: onnx onnxruntime peft
            timeout: 240
    container:
      image: ascendai/cann:9.0.0-910b-ubuntu22.04-py3.11
      env:
        UV_NO_SYNC: 1
    permissions:
      contents: read
    env:
      HF_ENDPOINT: ${{ vars.HF_ENDPOINT || 'https://huggingface.co' }}
      HF_HOME: /root/.cache/huggingface
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      PYTHON_VERSION: ${{ inputs.python_version_override || '3.12' }}
      RUN_SLOW: ${{ needs.sync.outputs.run_slow }}
    steps:
      - name: Checkout upstream commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.sync.outputs.upstream_sha }}
          path: transformers
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Pre-flight NPU status
        run: npu-smi info

      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ffmpeg tesseract-ocr openmpi-bin libopenmpi-dev libaio-dev

      - name: Install dependencies
        working-directory: transformers
        env:
          EXTRA_PIP: ${{ matrix.extra_pip }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.10.0 torchvision==0.25.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install torch_npu==2.10.0.post4
          python -m pip install -e ".[torch,testing,vision]"
          python -m pip install librosa ${EXTRA_PIP} \
            || echo "warning: librosa install failed (audio tests may skip)"
          python -m pip install \
            timm av pyctcdecode IPython optuna pytesseract "kernels==0.16.0" schedulefree wandb \
            optimum-quanto galore_torch apollo_torch torch-optimi grokadamw peft
          python -m pip install bitsandbytes torchao liger-kernel "ray[tune]" lomo_optim hqq mpi4py \
            || echo "warning: some optional deps unavailable on aarch64"
          python -m pip install deepspeed==0.19.2 \
            || echo "warning: deepspeed unavailable on aarch64"
          DS_BUILD_AIO=1 python -m pip install --no-binary "deepspeed[async-io]==0.19.2" \
            || echo "warning: deepspeed async-io build failed, falling back to plain deepspeed"
          python -m pip install -U "numpy>=2.0,<2.8" scipy
          python -m pip install triton-ascend==3.2.2 \
            --extra-index-url https://mirrors.huaweicloud.com/ascend/repos/pypi
          python -m pip install "pytest>=8.4.0" "pytest-xdist>=3.8.0"
          # torchcodec: torch 2.10 pairs with torchcodec 0.10, which has no
          # prebuilt linux-aarch64 wheel (0.13+cpu needs torch>=2.11 and the
          # PyPI default wheel is CUDA-flavoured). Build 0.10 from source for
          # the common job only; cache the wheel in the persistent /root/.cache
          # (keyed by torch major.minor) and fall back to a clean uninstall.
          if [ "${{ matrix.name }}" = "common" ]; then
            TV="$(python -c "import torch; print('.'.join(torch.__version__.split('+')[0].split('.')[:2]))")"
            CACHE="/root/.cache/wheels/torchcodec-torch${TV}"
            mkdir -p "${CACHE}"
            if python -m pip install --no-index --find-links "${CACHE}" torchcodec 2>/dev/null \
              && python -c "import torchcodec" 2>/dev/null; then
              echo "torchcodec restored from wheel cache: ${CACHE}"
            else
              python -m pip uninstall -y torchcodec > /dev/null 2>&1 || true
              apt-get install -y --no-install-recommends \
                libavcodec-dev libavformat-dev libavutil-dev libswresample-dev libswscale-dev \
                libavdevice-dev libavfilter-dev cmake pkg-config > /dev/null
              python -m pip install --quiet ninja pybind11 || true
              PYBIND11_CMAKE=$(python -m pybind11 --cmakedir 2>/dev/null || echo "")
              if [ -n "${PYBIND11_CMAKE}" ]; then
                export CMAKE_PREFIX_PATH="${PYBIND11_CMAKE}:${CMAKE_PREFIX_PATH:-}"
              fi
              if I_CONFIRM_THIS_IS_NOT_A_LICENSE_VIOLATION=1 \
                python -m pip wheel --no-deps --no-build-isolation -w "${CACHE}" \
                  "torchcodec @ git+https://github.com/pytorch/torchcodec@v0.10.0" \
                && python -m pip install --no-index --find-links "${CACHE}" torchcodec \
                && python -c "import torchcodec"; then
                echo "torchcodec 0.10 built, cached in ${CACHE} and importable"
              else
                python -m pip uninstall -y torchcodec
                echo "warning: torchcodec build/import failed, audio decoding tests will fail"
              fi
            fi
          fi

      - name: Diagnose integration import
        working-directory: transformers
        run: |
          python - <<'PY'
          import importlib
          import traceback

          try:
              module = importlib.import_module(
                  "transformers.integrations.integration_utils"
              )
              print("integration_utils import OK")
              print("is_clearml_available:", module.is_clearml_available())
          except Exception:
              traceback.print_exc()
              raise

      - name: Patch upstream NPU bug (get_device_properties)
        working-directory: transformers
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/transformers/testing_utils.py")
          text = path.read_text()

          old = "    if IS_NPU_SYSTEM:\n        if torch.npu.is_available():"
          new = "    if IS_NPU_SYSTEM:\n        import torch\n\n        if torch.npu.is_available():"
          assert old in text, "pattern not found in testing_utils.py"
          path.write_text(text.replace(old, new))
          print("patched get_device_properties IS_NPU_SYSTEM branch")
          PY

      - name: Enable native-NPU FlashAttention-2 tests
        working-directory: ${{ github.workspace }}
        run: |
          cat > npu_fa2_unlock.py <<'PY'
          """Unlock ``@require_flash_attn`` tests on Ascend NPU.

          Upstream ships a native NPU FlashAttention-2 implementation
          (transformers.integrations.npu_flash_attention) and accepts
          attn_implementation="flash_attention_2" on NPU without the CUDA-only
          ``flash-attn`` package. The ``require_flash_attn`` decorator however
          keys off ``is_flash_attn_2_available()``, which demands that package
          plus a CUDA/MLU device, so every gated test is skipped on NPU.

          This plugin replaces ``transformers.testing_utils.require_flash_attn``
          so it no longer skips on NPU systems. The availability helpers are
          intentionally left untouched: modeling internals (e.g.
          flash_attn_supports_top_left_mask) rely on them to select
          NPU-specific mask semantics.
          """

          import unittest


          def _on_npu():
              try:
                  import torch

                  return hasattr(torch, "npu") and bool(torch.npu.is_available())
              except Exception:
                  return False


          if _on_npu():

              def _require_flash_attn(test_case):
                  """NPU has native FA2 support: run the test unconditionally."""
                  return test_case

              try:
                  import transformers.testing_utils as _tu

                  _tu.require_flash_attn = _require_flash_attn
                  print("npu_fa2_unlock: require_flash_attn unlocked for NPU")
              except Exception as exc:
                  print(f"npu_fa2_unlock: could not patch require_flash_attn: {exc}")
          PY

      - name: Write NPU test fixes plugin
        working-directory: ${{ github.workspace }}
        run: |
          cat > npu_fixes.py <<'PY'
          """NPU CI test fixes: unique dist ports + DeepSpeed zero3 config repair.

          Fix 1 (MASTER_PORT): DeepSpeed/FSDP tests initialize the process group
          in-process; with ``-n 2 --dist=loadfile`` two workers concurrently bind
          the default ``MASTER_PORT=29500`` and one fails with EADDRINUSE.
          Assign each worker a disjoint port range (29500 + worker_index * 1000)
          and set RANK/WORLD_SIZE/LOCAL_RANK so DeepSpeed takes the env:// path
          (otherwise it falls back to mpi_discovery which hardcodes 29500).

          Fix 2 (DeepSpeed zero3 batch fields): upstream ``_deepspeed_zero3``
          builds a ``zero_optimization``-only config. Pure-text models only hit
          ``deepspeed.zero.Init()`` once and pass, but composite models (e.g.
          Qwen3.5 vision+text) nest ``AutoModel.from_config`` inside the context,
          which calls ``deepspeed.zero.Init(config_dict_or_path=deepspeed_config())``
          again; ``DeepSpeedConfig.__init__`` then asserts one of
          train_batch_size / train_micro_batch_size_per_gpu /
          gradient_accumulation_steps is present. Patch ``HfDeepSpeedConfig`` to
          inject ``train_micro_batch_size_per_gpu: 1`` when missing.
          """

          import os
          import re


          def pytest_configure(config):
              worker = os.environ.get("PYTEST_XDIST_WORKER", "gw0")
              match = re.search(r"gw(\d+)", worker)
              idx = int(match.group(1)) if match else 0
              port = 29500 + idx * 1000
              os.environ["MASTER_PORT"] = str(port)
              os.environ["MASTER_ADDR"] = "127.0.0.1"
              # DeepSpeed's init_distributed() checks for RANK/WORLD_SIZE/
              # LOCAL_RANK/MASTER_ADDR/MASTER_PORT. If any is missing it falls
              # back to mpi_discovery(), which hardcodes the default port 29500
              # and ignores our MASTER_PORT. Provide the single-process values so
              # the env:// path (and our unique ports) is always taken.
              os.environ.setdefault("RANK", "0")
              os.environ.setdefault("WORLD_SIZE", "1")
              os.environ.setdefault("LOCAL_RANK", "0")
              print(f"npu_fixes: worker={worker} MASTER_PORT={port}")

              try:
                  import transformers.integrations.deepspeed as _ds

                  _orig_init = _ds.HfDeepSpeedConfig.__init__

                  def _init_with_batch_fields(self, config_file_or_dict):
                      if isinstance(config_file_or_dict, dict):
                          cfg = config_file_or_dict
                          has_batch = any(
                              cfg.get(k) is not None
                              for k in (
                                  "train_batch_size",
                                  "train_micro_batch_size_per_gpu",
                                  "gradient_accumulation_steps",
                              )
                          )
                          if not has_batch:
                              cfg = dict(cfg)
                              cfg["train_micro_batch_size_per_gpu"] = 1
                              config_file_or_dict = cfg
                              print(
                                  "npu_fixes: injected train_micro_batch_size_per_gpu=1 "
                                  "into HfDeepSpeedConfig"
                              )
                      _orig_init(self, config_file_or_dict)

                  _ds.HfDeepSpeedConfig.__init__ = _init_with_batch_fields
                  print("npu_fixes: HfDeepSpeedConfig batch-field patch installed")
              except Exception as exc:
                  print(f"npu_fixes: HfDeepSpeedConfig patch failed: {exc}")

              try:
                  import transformers.testing_utils as _tu

                  _orig_find = _tu.Expectations.find_expectation

                  def _find_with_npu_fallback(self, properties=("npu", None, None)):
                      try:
                          return _orig_find(self, properties)
                      except ValueError:
                          # NPU has no matching expectation entry (upstream only
                          # ships cuda/xpu/rocm keys for many pipeline tests).
                          # Fall back to the CUDA expectation (then rocm): NPU
                          # aims for the same eager fp32 semantics, and the
                          # assertion compares entity text plus rounded scores.
                          for fallback_type in ("cuda", "rocm"):
                              for key, value in self.data.items():
                                  # packed keys unpack to (type, major, minor)
                                  key_type = key[0] if isinstance(key, tuple) else None
                                  if key_type == fallback_type:
                                      print(
                                          "npu_fixes: no npu expectation, "
                                          f"falling back to {fallback_type}"
                                      )
                                      return value
                          raise

                  _tu.Expectations.find_expectation = _find_with_npu_fallback
                  print("npu_fixes: Expectations NPU fallback patch installed")
              except Exception as exc:
                  print(f"npu_fixes: Expectations patch failed: {exc}")
          PY

      - name: Run tests
        working-directory: transformers
        run: |
          python -m pytest \
            -p random_order \
            -p npu_fa2_unlock \
            -p npu_fixes \
            -n 2 \
            --dist=loadfile \
            --random-order-bucket=module \
            --timeout=1800 \
            --timeout-method=signal \
            -rA \
            --junitxml=reports/junit_${{ matrix.name }}.xml \
            ${CI_TEST_PATH} \
            ${CI_TEST_EXCLUDE:+ -k "${CI_TEST_EXCLUDE}"}
        env:
          CI_TEST_PATH: ${{ matrix.test_path }}
          CI_TEST_EXCLUDE: ${{ matrix.exclude_k }}
          PYTHONPATH: ${{ github.workspace }}
          WANDB_MODE: offline

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.name }}
          path: transformers/reports/
          if-no-files-found: warn

  coverage:
    name: Coverage Watch
    needs: sync
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Checkout upstream tests
        uses: actions/checkout@v7
        with:
          ref: ${{ env.MIRROR_BRANCH }}
          path: transformers
          fetch-depth: 1
          persist-credentials: false

      - name: Check coverage
        run: |
          python3 -m pip install --quiet --disable-pip-version-check pyyaml
          python3 ci/check_coverage.py
        env:
          TEST_DIR: transformers/tests

  report:
    name: Test Report
    needs: ci
    if: always() && (needs.ci.result == 'success' || needs.ci.result == 'failure')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download test reports
        uses: actions/download-artifact@v4
        with:
          pattern: test-reports-*
          path: reports
          merge-multiple: true

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: success() || failure()
        with:
          name: Transformers Test Results
          path: reports/**/*.xml
          reporter: java-junit
          fail-on-error: false
          list-tests: "failed"
          use-actions-summary: true
