name: Transformers Sync and CI

on:
  workflow_dispatch:
    inputs:
      python_version_override:
        description: "Override the Python version (default: Python 3.12)"
        required: false
        type: string
      debug:
        description: "Run only the debug matrix entry (failing cases), skip common/models/trainer/extra"
        required: false
        type: boolean
        default: false
      debug_test_path:
        description: "Pytest path for the debug entry (default: deepspeed failing test files)"
        required: false
        type: string
      debug_k:
        description: "-k filter for the debug entry (default: deepspeed/resize cases)"
        required: false
        type: string

  schedule:
    - cron: "0 3 * * *"
      timezone: "Asia/Shanghai"

concurrency:
  group: transformers-sync-ci
  cancel-in-progress: true

permissions:
  contents: read

env:
  UPSTREAM_URL: ${{ vars.UPSTREAM_URL || 'https://github.com/huggingface/transformers.git' }}
  UPSTREAM_BRANCH: ${{ vars.UPSTREAM_BRANCH || 'main' }}
  MIRROR_BRANCH: ${{ vars.MIRROR_BRANCH || 'transformers-main' }}

jobs:
  sync:
    name: Sync upstream to mirror branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
      upstream_sha: ${{ steps.compare.outputs.upstream_sha }}
      run_slow: ${{ steps.runslow.outputs.run_slow }}
    steps:
      - name: Detect Sunday (long test day)
        id: runslow
        run: |
          if [ "$(TZ=Asia/Shanghai date +%u)" = "7" ]; then
            echo "run_slow=1" >> "${GITHUB_OUTPUT}"
          else
            echo "run_slow=0" >> "${GITHUB_OUTPUT}"
          fi

      - name: Checkout repository (full history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch upstream branch (full history)
        run: |
          git remote add upstream "${UPSTREAM_URL}"
          git fetch \
            --prune \
            --no-tags \
            upstream \
            "+refs/heads/${UPSTREAM_BRANCH}:refs/remotes/upstream/${UPSTREAM_BRANCH}"

      - name: Compare mirror and upstream SHAs
        id: compare
        run: |
          OLD_SHA="$(
            git rev-parse \
              --verify \
              "refs/remotes/origin/${MIRROR_BRANCH}" \
              2>/dev/null || true
          )"
          NEW_SHA="$(git rev-parse "refs/remotes/upstream/${UPSTREAM_BRANCH}")"

          if [[ -z "${OLD_SHA}" || "${OLD_SHA}" != "${NEW_SHA}" ]]; then
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          else
            echo "changed=false" >> "${GITHUB_OUTPUT}"
          fi
          echo "upstream_sha=${NEW_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Push mirror branch
        if: steps.compare.outputs.changed == 'true'
        env:
          SSH_KEY: ${{ secrets.TRANSFORMERS_SYNC_SSH_KEY }}
        run: |
          if [[ -z "${SSH_KEY}" ]]; then
            echo "Secret TRANSFORMERS_SYNC_SSH_KEY is not configured." >&2
            exit 1
          fi
          SSH_KEY_FILE="${RUNNER_TEMP}/deploy_key"
          printf '%s\n' "${SSH_KEY}" > "${SSH_KEY_FILE}"
          chmod 600 "${SSH_KEY_FILE}"
          export GIT_SSH_COMMAND="ssh -i ${SSH_KEY_FILE} -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git push --force "git@github.com:${GITHUB_REPOSITORY}.git" \
            "refs/remotes/upstream/${UPSTREAM_BRANCH}:refs/heads/${MIRROR_BRANCH}"
          rm -f "${SSH_KEY_FILE}"

  ci:
    name: CI (${{ matrix.name }})
    if: >-
      ${{ (inputs.debug == true && matrix.is_debug == true) ||
           (inputs.debug != true && matrix.is_debug != true) }}
    needs: sync
    runs-on: linux-aarch64-a2-2
    timeout-minutes: ${{ needs.sync.outputs.run_slow == '1' && 600 || matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: common
            test_path: tests/utils tests/generation tests/pipelines tests/tokenization tests/cli tests/repo_utils tests/test_image_transforms.py tests/test_monkey_patching.py tests/test_tokenization_common.py tests/test_tokenization_mistral_common.py tests/test_tokenizers_backend_mixin.py
            timeout: 240
            exclude_k: >-
              not ContinuousBatchingWithAcceleratorTest and not TestMemoryHandlerPrediction
              and not watermark
              and not test_pipeline_skip_special_tokens
              and not test_forward_model_kwargs
              and not test_pipeline_no_device
              and not quantized
              and not test_offloaded_cache_prefetches
              and not test_cpu_offload_doesnt_compile
              and not test_generate_multi_accelerator_causal_mask
              and not test_length_warning_assisted_generation
              and not test_pipeline_length_setting_warning
              and not test_load_img_url_timeout
              and not test_load_video_backend_torchvision
              and not test_qkv_chunk_rope_permute_with_fp8_quantization
              and not FillMaskPipelineTests
              and not ZeroShotObjectDetectionPipelineTests
              and not ImageFeatureExtractionPipelineTests
              and not ImageSegmentationPipelineTests
              and not VideoClassificationPipelineTests
              and not KeypointMatchingPipelineTests
              and not DepthEstimationPipelineTests
              and not CustomPipelineTest
              and not test_dynamic_rope_resets_after_long_sequence_nested
              and not test_longrope_rope_numerically
          - name: trainer
            test_path: tests/trainer tests/optimization
            timeout: 240
            exclude_k: >-
              not test_mixed_fp16
              and not test_load_best_model_with_save
              and not test_adalomo
              and not galore_adafactor
              and not galore_2_galore_adamw_8bit
          - name: models
            test_path: tests/models/qwen3
            timeout: 240
            exclude_k: >-
              not fsdp2
              and not test_tp_
              and not test_kernels_can_load_without_crashing
          - name: extra
            test_path: tests/exporters tests/integrations tests/heterogeneity tests/tensor_parallel tests/peft_integration
            extra_pip: onnx onnxruntime peft
            timeout: 240
            exclude_k: not test_from_config_dispatches_dynamo
          - name: debug
            is_debug: true
            test_path: ${{ inputs.debug_test_path || 'tests/trainer/distributed/test_trainer_distributed_deepspeed.py tests/models/qwen3/test_modeling_qwen3.py' }}
            timeout: 240
            exclude_k: ${{ inputs.debug_k || 'deepspeed or resize_embeddings or resize_tokens_embeddings' }}
    container:
      image: ascendai/cann:9.0.0-910b-ubuntu22.04-py3.11
      env:
        UV_NO_SYNC: 1
    permissions:
      contents: read
    env:
      HF_ENDPOINT: ${{ vars.HF_ENDPOINT || 'https://huggingface.co' }}
      HF_HOME: /root/.cache/huggingface
      PYTHON_VERSION: ${{ inputs.python_version_override || '3.12' }}
      RUN_SLOW: ${{ needs.sync.outputs.run_slow }}
    steps:
      - name: Checkout upstream commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.sync.outputs.upstream_sha }}
          path: transformers
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ffmpeg tesseract-ocr openmpi-bin libopenmpi-dev libaio-dev

      - name: Install dependencies
        working-directory: transformers
        env:
          EXTRA_PIP: ${{ matrix.extra_pip }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.10.0 torchvision==0.25.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install torch_npu==2.10.0.post4
          python -m pip install -e ".[torch,testing,vision]"
          python -m pip install librosa ${EXTRA_PIP}
          python -m pip install \
            timm av pyctcdecode IPython optuna pytesseract kernels schedulefree wandb \
            optimum-quanto galore_torch apollo_torch torch-optimi grokadamw peft
          python -m pip install bitsandbytes torchao liger-kernel "ray[tune]" lomo_optim hqq mpi4py \
            || echo "warning: some optional deps unavailable on aarch64"
          python -m pip install deepspeed==0.19.2 \
            || echo "warning: deepspeed unavailable on aarch64"
          DS_BUILD_AIO=1 python -m pip install --no-binary "deepspeed[async-io]==0.19.2" \
            || echo "warning: deepspeed async-io build failed, falling back to plain deepspeed"
          python -m pip install -U "numpy>=2.0,<2.8" scipy
          python -m pip install triton-ascend==3.2.2 \
            --extra-index-url https://mirrors.huaweicloud.com/ascend/repos/pypi

      - name: Diagnose integration import
        working-directory: transformers
        run: |
          python - <<'PY'
          import importlib
          import traceback

          try:
              module = importlib.import_module(
                  "transformers.integrations.integration_utils"
              )
              print("integration_utils import OK")
              print("is_clearml_available:", module.is_clearml_available())
          except Exception:
              traceback.print_exc()
              raise

      - name: Patch upstream NPU bug (get_device_properties)
        working-directory: transformers
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/transformers/testing_utils.py")
          text = path.read_text()

          old = "    if IS_NPU_SYSTEM:\n        if torch.npu.is_available():"
          new = "    if IS_NPU_SYSTEM:\n        import torch\n\n        if torch.npu.is_available():"
          assert old in text, "pattern not found in testing_utils.py"
          path.write_text(text.replace(old, new))
          print("patched get_device_properties IS_NPU_SYSTEM branch")
          PY

      - name: Run tests
        working-directory: transformers
        run: |
          python -m pytest \
            -p random_order \
            -n 2 \
            --dist=loadfile \
            --random-order-bucket=module \
            -rA \
            --junitxml=reports/junit_${{ matrix.name }}.xml \
            ${CI_TEST_PATH} \
            ${CI_TEST_EXCLUDE:+ -k "${CI_TEST_EXCLUDE}"}
        env:
          CI_TEST_PATH: ${{ matrix.test_path }}
          CI_TEST_EXCLUDE: ${{ matrix.exclude_k }}
          WANDB_MODE: offline

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.name }}
          path: transformers/reports/
          if-no-files-found: warn

  coverage:
    name: Coverage Watch
    needs: sync
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Checkout upstream tests
        uses: actions/checkout@v7
        with:
          ref: ${{ env.MIRROR_BRANCH }}
          path: transformers
          fetch-depth: 1
          persist-credentials: false

      - name: Check coverage
        run: |
          python3 -m pip install --quiet --disable-pip-version-check pyyaml
          python3 ci/check_coverage.py
        env:
          TEST_DIR: transformers/tests

  report:
    name: Test Report
    needs: ci
    if: always() && (needs.ci.result == 'success' || needs.ci.result == 'failure')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download test reports
        uses: actions/download-artifact@v4
        with:
          pattern: test-reports-*
          path: reports
          merge-multiple: true

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: success() || failure()
        with:
          name: Transformers Test Results
          path: reports/**/*.xml
          reporter: java-junit
          fail-on-error: false
          list-tests: "failed"
          use-actions-summary: true