name: Transformers Sync and CI

on:
  workflow_dispatch:
    inputs:
      force_ci:
        description: Run CI even if upstream is unchanged
        required: false
        default: false
        type: boolean
      python_version_override:
        description: Override the Python version (default: Python 3.11 from the CI image)
        required: false
        type: string

  schedule:
    - cron: "17 3 * * *"
      timezone: "Asia/Tokyo"

concurrency:
  group: transformers-sync-ci
  cancel-in-progress: true

permissions:
  contents: read

env:
  UPSTREAM_URL: ${{ vars.UPSTREAM_URL || 'https://github.com/huggingface/transformers.git' }}
  UPSTREAM_BRANCH: ${{ vars.UPSTREAM_BRANCH || 'main' }}
  MIRROR_BRANCH: ${{ vars.MIRROR_BRANCH || 'transformers-main' }}

jobs:
  sync:
    name: Sync upstream to mirror branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
      upstream_sha: ${{ steps.compare.outputs.upstream_sha }}
    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch upstream branch (full history)
        run: |
          git remote add upstream "${UPSTREAM_URL}"
          git fetch \
            --prune \
            --no-tags \
            upstream \
            "+refs/heads/${UPSTREAM_BRANCH}:refs/remotes/upstream/${UPSTREAM_BRANCH}"

      - name: Compare mirror and upstream SHAs
        id: compare
        run: |
          OLD_SHA="$(
            git rev-parse \
              --verify \
              "refs/remotes/origin/${MIRROR_BRANCH}" \
              2>/dev/null || true
          )"
          NEW_SHA="$(git rev-parse "refs/remotes/upstream/${UPSTREAM_BRANCH}")"

          if [[ -z "${OLD_SHA}" || "${OLD_SHA}" != "${NEW_SHA}" ]]; then
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          else
            echo "changed=false" >> "${GITHUB_OUTPUT}"
          fi
          echo "upstream_sha=${NEW_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Push mirror branch
        if: steps.compare.outputs.changed == 'true'
        env:
          SSH_KEY: ${{ secrets.TRANSFORMERS_SYNC_SSH_KEY }}
        run: |
          if [[ -z "${SSH_KEY}" ]]; then
            echo "Secret TRANSFORMERS_SYNC_SSH_KEY is not configured." >&2
            exit 1
          fi
          SSH_KEY_FILE="${RUNNER_TEMP}/deploy_key"
          printf '%s\n' "${SSH_KEY}" > "${SSH_KEY_FILE}"
          chmod 600 "${SSH_KEY_FILE}"
          export GIT_SSH_COMMAND="ssh -i ${SSH_KEY_FILE} -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git push --force "git@github.com:${GITHUB_REPOSITORY}.git" \
            "refs/remotes/upstream/${UPSTREAM_BRANCH}:refs/heads/${MIRROR_BRANCH}"
          rm -f "${SSH_KEY_FILE}"

  ci:
    name: CI (${{ matrix.name }})
    needs: sync
    if: |
      needs.sync.outputs.changed == 'true' ||
      inputs.force_ci == true
    runs-on: linux-aarch64-a2-2
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: common
            test_path: tests/utils tests/generation tests/pipelines tests/tokenization tests/cli tests/repo_utils
            timeout: 240
          - name: trainer
            test_path: tests/trainer tests/optimization
            timeout: 240
          - name: models
            test_path: tests/models tests/quantization
            timeout: 600
    container:
      image: ghcr.io/${{ github.repository }}/transformers-ci-cann:latest
      env:
        UV_NO_SYNC: 1
    permissions:
      contents: read
    env:
      HF_ENDPOINT: ${{ vars.HF_ENDPOINT || 'https://huggingface.co' }}
      HF_HOME: /root/.cache/huggingface
      PY: ${{ inputs.python_version_override != '' && 'python' || 'python3' }}
    steps:
      - name: Checkout upstream commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.sync.outputs.upstream_sha }}
          path: transformers
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python (override)
        if: inputs.python_version_override != ''
        uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python_version_override }}
          cache: pip
          cache-dependency-path: transformers/setup.py

      - name: Compute cache keys
        id: cache-key
        run: |
          echo "hf_cache=hf-cache-$(date +%Y-W%W)" >> "${GITHUB_OUTPUT}"
          echo "pip_cache=pip-cache-$(date +%Y-W%W)" >> "${GITHUB_OUTPUT}"

      - name: Restore Hugging Face cache
        uses: actions/cache@v4
        with:
          path: /root/.cache/huggingface
          key: ${{ steps.cache-key.outputs.hf_cache }}
          restore-keys: hf-cache-

      - name: Restore pip cache
        uses: actions/cache@v4
        with:
          path: /root/.cache/pip
          key: ${{ steps.cache-key.outputs.pip_cache }}
          restore-keys: pip-cache-

      - name: Install transformers (editable)
        working-directory: transformers
        run: |
          ${PY} -m pip install --upgrade pip
          ${PY} -m pip install -e ".[torch,testing,vision]"

      - name: Run tests
        working-directory: transformers
        run: |
          ${PY} -m pytest \
            -p random_order \
            -n 2 \
            --dist=loadfile \
            --random-order-bucket=module \
            -rA \
            ${CI_TEST_PATH}
        env:
          CI_TEST_PATH: ${{ matrix.test_path }}
