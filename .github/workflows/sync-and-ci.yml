name: Transformers Sync and CI

on:
  workflow_dispatch:
    inputs:
      force_ci:
        description: Run CI even if upstream is unchanged
        required: false
        default: false
        type: boolean
      test_path_override:
        description: Override the CI test path
        required: false
        type: string
      python_version_override:
        description: Override the Python version
        required: false
        type: string

  schedule:
    - cron: "17 3 * * *"
      timezone: "Asia/Tokyo"

concurrency:
  group: transformers-sync-ci
  cancel-in-progress: true

permissions:
  contents: read

env:
  UPSTREAM_URL: ${{ vars.UPSTREAM_URL || 'https://github.com/huggingface/transformers.git' }}
  UPSTREAM_BRANCH: ${{ vars.UPSTREAM_BRANCH || 'main' }}
  MIRROR_BRANCH: ${{ vars.MIRROR_BRANCH || 'transformers-main' }}

jobs:
  sync:
    name: Sync upstream to mirror branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
      upstream_sha: ${{ steps.compare.outputs.upstream_sha }}
    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch upstream branch (full history)
        run: |
          git remote add upstream "${UPSTREAM_URL}"
          git fetch \
            --prune \
            --no-tags \
            upstream \
            "+refs/heads/${UPSTREAM_BRANCH}:refs/remotes/upstream/${UPSTREAM_BRANCH}"

      - name: Compare mirror and upstream SHAs
        id: compare
        run: |
          OLD_SHA="$(
            git rev-parse \
              --verify \
              "refs/remotes/origin/${MIRROR_BRANCH}" \
              2>/dev/null || true
          )"
          NEW_SHA="$(git rev-parse "refs/remotes/upstream/${UPSTREAM_BRANCH}")"

          if [[ -z "${OLD_SHA}" || "${OLD_SHA}" != "${NEW_SHA}" ]]; then
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          else
            echo "changed=false" >> "${GITHUB_OUTPUT}"
          fi
          echo "upstream_sha=${NEW_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Push mirror branch
        if: steps.compare.outputs.changed == 'true'
        env:
          SSH_KEY: ${{ secrets.TRANSFORMERS_SYNC_SSH_KEY }}
        run: |
          if [[ -z "${SSH_KEY}" ]]; then
            echo "Secret TRANSFORMERS_SYNC_SSH_KEY is not configured." >&2
            exit 1
          fi
          SSH_KEY_FILE="${RUNNER_TEMP}/deploy_key"
          printf '%s\n' "${SSH_KEY}" > "${SSH_KEY_FILE}"
          chmod 600 "${SSH_KEY_FILE}"
          export GIT_SSH_COMMAND="ssh -i ${SSH_KEY_FILE} -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git push --force "git@github.com:${GITHUB_REPOSITORY}.git" \
            "refs/remotes/upstream/${UPSTREAM_BRANCH}:refs/heads/${MIRROR_BRANCH}"
          rm -f "${SSH_KEY_FILE}"

  ci:
    name: CI on latest upstream commit
    needs: sync
    if: |
      needs.sync.outputs.changed == 'true' ||
      inputs.force_ci == true
    runs-on: linux-aarch64-a2-8
    container:
      image: ascendai/cann:9.0.0-910b-ubuntu22.04-py3.11
      env:
        HF_ENDPOINT: https://hf-mirror.com
        UV_NO_SYNC: 1
    permissions:
      contents: read
    env:
      PYTHON_VERSION: ${{ inputs.python_version_override || vars.PYTHON_VERSION || '3.12' }}
      CI_TEST_PATH: ${{ inputs.test_path_override || vars.CI_TEST_PATH || 'tests/utils' }}
    steps:
      - name: Checkout upstream commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.sync.outputs.upstream_sha }}
          path: transformers
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: transformers/setup.py

      - name: Install dependencies
        working-directory: transformers
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[torch,testing]"

      - name: Run tests
        working-directory: transformers
        run: |
          python -m pytest \
            -p random_order \
            -n 2 \
            --dist=loadfile \
            --random-order-bucket=module \
            -rA \
            "${CI_TEST_PATH}"
